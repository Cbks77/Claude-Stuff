name: Deploy Vault → Netlify

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-vault.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy vault to Netlify via API
        run: |
          cd vault
          zip -r /tmp/vault.zip .
          RESP=$(curl -sf -X POST \
            "https://api.netlify.com/api/v1/sites/3e249442-35d2-485b-b66e-7910a9039fdb/deploys?production=true" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/vault.zip)
          echo "$RESP" | python3 -c "import json,sys; r=json.load(sys.stdin); print('Deploy:', r.get('id'), '| State:', r.get('state','?')) if 'id' in r else (print('Error:', r), sys.exit(1))"

      - name: Register vault.cbks77.com on Netlify
        run: |
          HTTP=$(curl -s -o /tmp/netlify_domain.json -w "%{http_code}" -X POST \
            "https://api.netlify.com/api/v1/sites/3e249442-35d2-485b-b66e-7910a9039fdb/domain_aliases" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"alias":"vault.cbks77.com"}')
          echo "Netlify domain alias HTTP $HTTP"
          cat /tmp/netlify_domain.json

      - name: Point Cloudflare DNS vault.cbks77.com → Netlify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set - skipping"
            exit 0
          fi

          ZONE_ID=$(curl -sf "https://api.cloudflare.com/client/v4/zones?name=cbks77.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Zone ID: $ZONE_ID"

          RECORD_IDS=$(curl -s \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=vault.cbks77.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            python3 -c "import json,sys; data=json.load(sys.stdin); [print(r['id']+' '+r['type']+' '+r.get('content','')) for r in data.get('result',[])]")

          if [ -n "$RECORD_IDS" ]; then
            echo "Deleting existing records:"
            echo "$RECORD_IDS"
            echo "$RECORD_IDS" | while read -r RID RTYPE RCONTENT; do
              echo "  Deleting $RTYPE $RCONTENT ($RID)"
              curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
                python3 -c "import json,sys; r=json.load(sys.stdin); print('  Deleted OK') if r.get('success') else print('  Delete error:', r)"
            done
          else
            echo "No existing records for vault.cbks77.com"
          fi

          echo "Creating CNAME vault -> cbks77-vault.netlify.app"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"vault","content":"cbks77-vault.netlify.app","ttl":1,"proxied":false}' | \
            python3 -c "import json,sys; r=json.load(sys.stdin); print('CNAME created:', r['result']['name']) if r['success'] else (print('DNS error:', r.get('errors')) or sys.exit(1))"
