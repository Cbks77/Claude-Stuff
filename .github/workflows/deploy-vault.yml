name: Deploy Vault → Netlify

on:
  push:
    branches: [main]
    paths:
      - 'vault/**'
      - 'netlify.toml'
      - '.github/workflows/deploy-vault.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy vault to Netlify via API
        run: |
          cd vault
          zip -r /tmp/vault.zip .
          RESP=$(curl -sf -X POST \
            "https://api.netlify.com/api/v1/sites/3e249442-35d2-485b-b66e-7910a9039fdb/deploys?production=true" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @/tmp/vault.zip)
          echo "$RESP" | python3 -c "import json,sys; r=json.load(sys.stdin); print('Deploy:', r.get('id'), '| State:', r.get('state','?')) if 'id' in r else (print('Error:', r), sys.exit(1))"

      - name: Register vault.cbks77.com on Netlify
        run: |
          HTTP=$(curl -s -o /tmp/netlify_domain.json -w "%{http_code}" -X POST \
            "https://api.netlify.com/api/v1/sites/3e249442-35d2-485b-b66e-7910a9039fdb/domain_aliases" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"alias":"vault.cbks77.com"}')
          echo "Netlify domain alias HTTP $HTTP"
          cat /tmp/netlify_domain.json

      - name: Point vault.cbks77.com → Netlify via Hostinger DNS
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "HOSTINGER_API_TOKEN not set - skipping"
            exit 0
          fi

          echo "Updating vault CNAME → cbks77-vault.netlify.app"
          HTTP=$(curl -s -o /tmp/dns_resp.json -w "%{http_code}" -X PUT \
            "https://api.hostinger.com/api/dns/v1/zones/cbks77.com" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"overwrite":true,"zone":[{"name":"vault","type":"CNAME","ttl":300,"records":[{"content":"cbks77-vault.netlify.app"}]}]}')
          echo "Hostinger DNS HTTP $HTTP"
          cat /tmp/dns_resp.json
          [ "$HTTP" = "200" ] || [ "$HTTP" = "204" ] || { echo "DNS update failed"; exit 1; }
          echo "DNS updated - vault.cbks77.com now points to Netlify"
